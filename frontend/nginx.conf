server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
    }
    location /health/ { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
