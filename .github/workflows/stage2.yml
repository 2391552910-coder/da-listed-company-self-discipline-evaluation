name: Stage2 document services
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  documents:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dalun_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/dalun_ci
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/dalun_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: python -m pip install -r requirements-test.txt
        working-directory: backend
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m pytest tests -q --junitxml=../test-results/stage2.xml
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-test-results
          path: test-results/
