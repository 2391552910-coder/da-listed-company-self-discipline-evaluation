name: Thesis system verification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dalun_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/dalun_ci
      TEST_LEGACY_SEED: "1"
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/dalun_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: python -m pip install -r requirements-test.txt
        working-directory: backend
      - run: python -m alembic -c alembic.ini upgrade 0001_documents
        working-directory: backend
      - run: python -m app.documents.cli company 019998 MigrationFixture
        working-directory: backend
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m pytest tests -q --junitxml=../test-results/stage67.xml
        working-directory: backend
      - run: python scripts/smoke-backup-postgres.py --output test-results/postgres-backup.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install --no-save @playwright/test@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage67-test-results
          path: test-results/
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: python -m pip install -r requirements-test.txt
        working-directory: backend
      - run: python -m pytest tests -q --basetemp=C:/dalun-tests --junitxml=../test-results/windows-stage67.xml
        working-directory: backend
      - name: Check PowerShell entry points
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "Invalid PowerShell entry point" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-stage67-test-results
          path: test-results/
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Prepare isolated deployment fixture
        run: |
          docker compose version
          mkdir -p test-results
          printf '%s\n' 'POSTGRES_PASSWORD=ci-only-deployment-fixture' 'COMPOSE_PROJECT_NAME=dalunacceptance' 'DALUN_BIND_ADDRESS=127.0.0.1' 'DALUN_WEB_PORT=8080' > "$RUNNER_TEMP/dalun-acceptance.env"
          docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml config --quiet
          bash -n scripts/*.sh
      - name: Build and start isolated Compose stack
        run: docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml up -d --build --wait --wait-timeout 240
      - name: Start acknowledged synthetic provider on Worker loopback
        run: docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml exec -d worker python -m app.operations.fixture_provider --acknowledge-synthetic-fixture
      - name: Verify Nginx and independent Worker flow
        run: python scripts/smoke-deployment.py --base-url http://127.0.0.1:8080 --state test-results/deployment-state.json --acknowledge-synthetic-fixture
      - name: Restart application containers and verify persisted artifacts
        run: |
          docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml restart backend worker frontend
          python scripts/smoke-deployment.py --base-url http://127.0.0.1:8080 --state test-results/deployment-state.json --verify-state --acknowledge-synthetic-fixture
      - name: Save container state and logs
        if: always()
        run: |
          docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml ps --all > test-results/deployment-services.txt
          docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml logs --no-color > test-results/deployment.log
      - name: Stop isolated acceptance stack without deleting volumes
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/dalun-acceptance.env" -f compose.yml -f deploy/compose.acceptance.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-stage67-test-results
          path: test-results/
